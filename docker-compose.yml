x-firewall: &firewall
  cap_add: [NET_ADMIN]
  cap_drop: [NET_RAW]
  security_opt: ["no-new-privileges:true"]

services:
  event-api:
    <<: *firewall
    build: .
    environment:
      SEPS_ROLE: event-api
      SEPS_NETWORK_PREFIX: ${SEPS_NETWORK_PREFIX:-172.28}
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env}
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER:?Copy .env.example to .env}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in .env}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-60}
    networks:
      api-db:
        ipv4_address: ${SEPS_NETWORK_PREFIX:-172.28}.10.2
      api-cache:
        ipv4_address: ${SEPS_NETWORK_PREFIX:-172.28}.11.2
      api-mq:
        ipv4_address: ${SEPS_NETWORK_PREFIX:-172.28}.12.2
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  event-worker: &worker
    <<: *firewall
    build: .
    command: ["tini", "-g", "--", "python", "-m", "app.worker"]
    environment:
      SEPS_ROLE: event-worker
      SEPS_NETWORK_PREFIX: ${SEPS_NETWORK_PREFIX:-172.28}
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER:?Copy .env.example to .env}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in .env}
    networks:
      worker-mq:
        ipv4_address: ${SEPS_NETWORK_PREFIX:-172.28}.13.2
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  event-worker-standby:
    <<: *worker
    environment:
      SEPS_ROLE: event-worker-standby
      SEPS_NETWORK_PREFIX: ${SEPS_NETWORK_PREFIX:-172.28}
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER:?Copy .env.example to .env}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in .env}
    networks:
      worker-mq:
        ipv4_address: ${SEPS_NETWORK_PREFIX:-172.28}.13.4

  postgres:
    <<: *firewall
    build:
      context: .
      dockerfile: docker/Infrastructure.Dockerfile
      args:
        BASE_IMAGE: postgres:17-alpine
    command: ["postgres"]
    restart: unless-stopped
    environment:
      SEPS_ROLE: postgres
      SEPS_NETWORK_PREFIX: ${SEPS_NETWORK_PREFIX:-172.28}
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env}
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    networks:
      api-db:
        ipv4_address: ${SEPS_NETWORK_PREFIX:-172.28}.10.3
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    <<: *firewall
    build:
      context: .
      dockerfile: docker/Infrastructure.Dockerfile
      args:
        BASE_IMAGE: redis:7.4-alpine
    environment:
      SEPS_ROLE: redis
      SEPS_NETWORK_PREFIX: ${SEPS_NETWORK_PREFIX:-172.28}
    networks:
      api-cache:
        ipv4_address: ${SEPS_NETWORK_PREFIX:-172.28}.11.3
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  rabbitmq:
    <<: *firewall
    build:
      context: .
      dockerfile: docker/Infrastructure.Dockerfile
      args:
        BASE_IMAGE: rabbitmq:4-management-alpine
    command: ["rabbitmq-server"]
    restart: unless-stopped
    hostname: rabbitmq
    environment:
      SEPS_ROLE: rabbitmq
      SEPS_NETWORK_PREFIX: ${SEPS_NETWORK_PREFIX:-172.28}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?Copy .env.example to .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in .env}
    networks:
      api-mq:
        ipv4_address: ${SEPS_NETWORK_PREFIX:-172.28}.12.3
      worker-mq:
        ipv4_address: ${SEPS_NETWORK_PREFIX:-172.28}.13.3
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  postgres_data:
  rabbitmq_data:

networks:
  api-db:
    internal: true
    ipam:
      config:
        - subnet: ${SEPS_NETWORK_PREFIX:-172.28}.10.0/29
  api-cache:
    internal: true
    ipam:
      config:
        - subnet: ${SEPS_NETWORK_PREFIX:-172.28}.11.0/29
  api-mq:
    # Обычный bridge сохраняет предсказуемую публикацию localhost-портов.
    # Исходящие соединения дополнительно ограничены локальным firewall.
    ipam:
      config:
        - subnet: ${SEPS_NETWORK_PREFIX:-172.28}.12.0/29
  worker-mq:
    internal: true
    ipam:
      config:
        - subnet: ${SEPS_NETWORK_PREFIX:-172.28}.13.0/29
